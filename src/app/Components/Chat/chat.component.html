<div class="chat-container">

  <!-- ── Header ─────────────────────────────────────────────────────────── -->
  <div class="chat-header">
    <h2>🚲 Bike Rental AI Assistant</h2>

    <!-- New Conversation button — resets history on both frontend and backend -->
    <!-- [disabled]="isLoading" prevents accidental reset during a pending call -->
    <button
      (click)="newConversation()"
      [disabled]="isLoading"
      class="new-conversation-btn"
      title="Start a fresh conversation"
    >
      + New Chat
    </button>
  </div>

  <!-- ── Message List ───────────────────────────────────────────────────── -->
  <div class="chat-messages">

    <div
      *ngFor="let msg of messages"
      [class]="msg.sender === 'user' ? 'message user-message' : 'message bot-message'"
    >
      <span class="sender-icon">{{ msg.sender === 'user' ? '👤' : '🤖' }}</span>
      <span class="message-text">{{ msg.text }}</span>
    </div>

    <!-- Loading indicator while waiting for AI response -->
    <div *ngIf="isLoading" class="message bot-message">
      <span class="sender-icon">🤖</span>
      <span class="message-text loading-text">Typing...</span>
    </div>

  </div>

  <!-- ── Input Area ─────────────────────────────────────────────────────── -->
  <div class="chat-input-area">

    <input
      type="text"
      [(ngModel)]="message"
      (keydown.enter)="sendMessage()"
      placeholder="Type your message here..."
      [disabled]="isLoading"
      class="chat-input"
    />

    <button
      (click)="sendMessage()"
      [disabled]="isLoading || !message.trim()"
      class="send-button"
    >
      Send
    </button>

  </div>

</div>
